[package]
name = "fahhh"
version = "0.1.0"
description = "Software soundboard"
repository = "https://github.com/haras-unicorn/fahhh"
authors = ["haras-unicorn <github@haras-unicorn.net>"]
license-file = "../../LICENSE.md"
readme = "../../README.md"
edition = "2024"

[dependencies]
gtk = { version = "0.11", package = "gtk4", features = ["v4_20"] }
ashpd = { version = "0.13", default-features = false, features = [
  "async-io",
  "pipewire",
  "frontend",
  "glib",
  "gtk4",
  "gtk4_wayland",
  "wayland",
] }
rodio = "0.22"
serde = { version = "1.0", features = ["derive"] }
